[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "juris-br-mcp"
version = "0.2.0"
description = "MCP de processos judiciais brasileiros - DataJud CNJ e DJEN: consulta, publicações e intimações, partes, monitoramento e prazos. Baseado em mcp-juridico-brasil (Nikolas de Hor)."
authors = [
    { name = "André Cruz" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "mcp",
    "model-context-protocol",
    "claude",
    "juridico",
    "judicial",
    "brasil",
    "brazil",
    "datajud",
    "cnj",
    "processo",
    "advocacia",
    "legaltech",
    "prazo",
    "intimacao",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Office Suites",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastmcp>=3.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.13.1",
    "python-dateutil>=2.9.0",
    "tenacity>=9.1.4",
    "cachetools>=7.0.5",
    "aiolimiter>=1.2.1",
    "structlog>=25.5.0",
    "typer>=0.25.1",
    "workalendar>=17.0.0",
    "cryptography>=50.0.0",
    "mcp>=1.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "respx>=0.22.0",
]

[project.scripts]
juris-br-mcp = "juris_br_mcp.server:main"
juris-br = "juris_br_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/andrecccruz/juris-br-mcp"
Repository = "https://github.com/andrecccruz/juris-br-mcp"
Issues = "https://github.com/andrecccruz/juris-br-mcp/issues"
Changelog = "https://github.com/andrecccruz/juris-br-mcp/blob/main/CHANGELOG.md"
Examples = "https://github.com/andrecccruz/juris-br-mcp/tree/main/examples"

[tool.hatch.build.targets.wheel]
packages = ["src/juris_br_mcp"]

[tool.hatch.build.targets.sdist]
exclude = ["landing"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["juris_br_mcp"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["juris_br_mcp.server"]
disallow_untyped_decorators = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["workalendar.*", "dateutil.*", "lunardate.*", "pyluach.*", "pymeeus.*"]
ignore_missing_imports = true
ignore_errors = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "respx>=0.22.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
    "types-python-dateutil>=2.9.0.20260518",
]
